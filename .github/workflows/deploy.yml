name: Deploy invitation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  build-and-api:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_BASE_PATH: /yalda-night-invitation
      ALLOWED_ORIGIN: https://${{ github.repository_owner }}.github.io
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: node scripts/production-config.mjs
      - run: pnpm exec wrangler d1 migrations apply yalda --remote --config apps/api/wrangler.production.json
      - run: pnpm exec wrangler deploy --config apps/api/wrangler.production.json
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  pages:
    needs: build-and-api
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static export
        id: deployment
        uses: actions/deploy-pages@v4
